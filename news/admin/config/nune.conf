<?

#
# This the configuration file used by NUNE for many, many things.
#

#
# < Miscellaneous Options >
#

# This is your language, right now only english is supported.
$lang = 'english'; 	

# How many posts to display at a time? 
$limit = 8; 		

# Put the site name
$www_site_name		= 'Banana Community';

# Put the site address (this is no longer used for your cookie path, see below)
$www_site_address 	= 'banana.dhs.org'; 

# Put the www address to your news/admin directory
$www_admin_path	= 'banana.dhs.org/news/admin';

# This is the path to which all cookies are set... must be a path and not a specific file
# GOOD: $www_cookie_path =  'www.mysite.com';
# BAD!: $www_cookie_path =  'www.mysite.com/index.html';
$www_cookie_path	= 'banana.dhs.org';

# Your preferred font(s)
$font = 'Verdana, Arial, Lucida';

# Path to your news/admin directory (no trailing slash) from wherever you display news...
# NOTE: If you use the /news/index.php file directly then it should be set to 'admin',
# but if you include it (like you should) then it should be set to 'news/admin'.
$admin_path = 'news/admin';

# Enable html in posts (Default: 1)
$html_enable = 1;

# Set the paths to the header.inc and the footer.inc, the default
# is usually right.
# NOTE: These are used for the admin area of NUNE.

$head = "include/header.inc";
$foot = "include/footer.inc";

#
# < Comment Options >
# For all the following, remember that 1 = on, 0 = off.

# Enable Comments... (Default: 1)
# This must be on or comments will not work.
$_comment[enable] = 1;

# Authorization... (Default: 0)
# If on, then it checks username and password against the user db.  If they
# aren't there, then they cannot comment.
$_comment[auth] = 0;

# Auto Cookie... (Default: 1)
# Automatically sends cookie to user to remember user, pass and email for
# the comment fields... can be insecure because passwords are stored
# in plaintext.  Very convienent though.
$_comment[auto_cookie] = 0;

# Check User... (Default: 1)
# If on, then it checks username and password against the user db.  If they
# are found, then it posts their access level beside name.
# Just for show :)
$_comment[check] = 0;

# Show Host... (Default: 1)
# If on, then it will display the host of the posters beside their name.
$_comment[show_host] = 1;

# Comment Auto Delete... (Default: 1)
# When a post is deleted, NUNE will automatically delete all comments 
# associated with that post.
$_comment[auto_delete] = 1;

# Define Custom Ranks 
# You may change what the default access levels show if $_comment[check] is on.
# NOTE: If you change one, you must change them all.
#
# Defaults:
# 0 - Anonymous	(signifies anonymous or unregistered users)
# 1 - Member 
# 2 - Moderator
# 3 - Administrator
#$custom_rank[0] = 'Peasant';
#$custom_rank[1] = 'Noble';
#$custom_rank[2] = 'Baron';
#$custom_rank[3] = 'God';

#
# < Archive Options >
# Edit this area to correspond to your desired archive settings.
#

# Enable Archiving? (Default: 1)
$_archive[enable] = 1;

# Sort by? 0 = Month, 1 = Week... (Default: 0)
$_archive[sort_by] = 0;

#
# < Template Paths >
# These shouldn't have to be changed.
#

# Main template path.
$template_path			=	"$admin_path/include/templates";

# Path to general error template.
$error_path			=	"$template_path/error.php";

# Path to comment confirmation template.
$comment_confirm_path	=	"$template_path/comment_confirm.php";

# Path to comment form template.
$comment_form_path		=	"$template_path/comment_form.php";

# Path to comment post template.
$comment_post_path		=	"$template_path/comment_post.php";

# Path to normal post template.
$post_path			=	"$template_path/post.php";

# Path to archives page template.
$archives_page_path		=	"$template_path/archives_page.php";

#
# < MySQL Options >
# Edit this area to correspond to your MySQL settings.
# NOTE: If you have no password for you MySQL db then
# you have a fairly large security hole.
#

$hostname = 'localhost'; 	# usually localhost
$username = 'nunemgr'; 		# if you have no username, leave this space empty
$password = 'REDACTED';	# the same applies here

$newstable = 'news';	# the mysql tbl_name for the news table, probably 'news'
$usertable = 'user';	# the mysql tbl_name for the user table, probably 'user'
$commtable = 'comments'; # the mysql tbl_name for the comments table, probably 'comments'

$database = 'banana';		# this is the main database you connect to

#
# < Tinkering Options >
# This is where you can tinker with some of the details of the page, without
